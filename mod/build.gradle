apply plugin: 'java'

java{
    sourceCompatibility = 17
    targetCompatibility = 17
}

sourceSets{
    main{
        java.srcDirs = ['src']
        resources.srcDirs = ['assets/sprites']
    }
}

dependencies{
    compileOnly "Anuken:Mindustry:$mindustryVersion"
    compileOnly project(':annotations')
    annotationProcessor project(':annotations')
}

tasks.withType(JavaCompile).configureEach{
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        "-AmodName=$modName",
        "-AclassPrefix=$classPrefix",
        "-AgenPackage=$genPackage"
    ]
}

jar{
    archiveFileName = "${modArtifact}Desktop.jar"
    from rootProject.file('mod.hjson')
    def icon = rootProject.file('icon.png')
    if(icon.exists()){
        from icon
    }
    exclude '**/.gitkeep'
}

tasks.register('jarAndroid', Jar){
    archiveFileName = "${modArtifact}Android.jar"
    dependsOn jar

    final def desktopJar = jar.archiveFile.get().asFile
    final def dexJar = new File(temporaryDir, 'Dexed.jar')
    final def windows = System.getProperty('os.name').toLowerCase().contains('windows')

    doFirst {
        if(!sdkRoot){
            throw new GradleException("Android SDK not found. Set ANDROID_HOME (or ANDROID_SDK_ROOT) to build for Android.")
        }

        def d8 = null
        def buildTools = file("$sdkRoot/build-tools")
        if(buildTools.directory){
            def versions = buildTools.listFiles().findAll { it.isDirectory() }*.name.sort()
            if (!versions.empty) {
                def candidate = new File(buildTools, "${versions.last()}/${windows ? 'd8.bat' : 'd8'}")
                if (candidate.exists()) d8 = candidate.path
            }
        }
        if (!d8) d8 = windows ? 'd8.bat' : 'd8'

        def command = [d8, '--min-api', sdkAPI, '--output', dexJar.path, desktopJar.path]
        for(file in configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList()) {
            command += ['--classpath', file.path]
        }
        command += ['--lib', file("$sdkRoot/platforms/android-$sdkVersion/android.jar").path]
        if (windows) command = ['cmd', '/c'] + command

        logger.lifecycle("> d8 --min-api $sdkAPI --output ${dexJar.name} ${desktopJar.name}")
        def process
        try{
            process = command.execute(null, file("$buildDir/libs"))
        } catch (IOException e){
            throw new GradleException("Cannot run d8 ('$d8'). Install Android build-tools or add d8 to PATH.", e)
        }
        process.waitForProcessOutput(System.out, System.err)
        if (process.exitValue() != 0) {
            throw new GradleException("d8 failed with exit code ${process.exitValue()}.")
        }
    }

    from zipTree(desktopJar)
    from zipTree(dexJar)
}

tasks.register('deploy', Jar){
    dependsOn jarAndroid, jar
    archiveFileName = "${modArtifact}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from{
        [zipTree("$buildDir/libs/${modArtifact}Desktop.jar"), zipTree("$buildDir/libs/${modArtifact}Android.jar")]
    }
    doLast{
        delete{
            delete "$buildDir/libs/${modArtifact}Android.jar"
        }
    }
}