apply plugin: 'java'

java{
    sourceCompatibility = 17
    targetCompatibility = 17
}

sourceSets{
    main{
        java.srcDirs = ['src']
    }
}

def modProject = project(':mod')

dependencies{
    implementation "Anuken:Mindustry:$mindustryVersion"
    implementation files(modProject.sourceSets.main.output.classesDirs)
}

tasks.named('compileJava'){
    dependsOn modProject.tasks.named('compileJava')
}

def rawDir = file("$rootDir/mod/assets-raw/sprites")
def fallbackDir = file("$rootDir/mod/assets-fallback/sprites")
def outDir = file("$rootDir/mod/assets/sprites")

tasks.register('run', JavaExec){
    group = 'tools'
    description = 'Processes mod/assets-raw/sprites into mod/assets/sprites (with mod init + previews).'
    dependsOn 'classes'
    mainClass = 'nitis.gravillaso.tools.Tools'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = temporaryDir

    args = [file("$rootDir/mod").absolutePath, modName]

    doFirst{
        delete "$temporaryDir/sprites"
        delete "$temporaryDir/fallback"

        copy{
            from rawDir
            into "$temporaryDir/sprites"
            exclude '**/*.ase'
        }

        //vanilla sprites used by processors only; kept outside 'sprites' so they are never shipped
        if(fallbackDir.exists()){
            copy{
                from fallbackDir
                into "$temporaryDir/fallback"
            }
        }
    }

    doLast{
        delete outDir
        copy{
            from "$temporaryDir/sprites"
            into outDir
        }
    }
}